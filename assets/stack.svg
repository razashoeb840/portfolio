<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="auto" style="background:#070b16; border-radius:18px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <radialGradient id="stack_glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#070b16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="stack_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(36,123,255,0.7)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.1)" />
      <stop offset="100%" stop-color="rgba(0,245,255,0.6)" />
    </linearGradient>

    <style>
      @keyframes orbit_pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.03); opacity: 1; }
      }
      .orbit-center {
        animation: orbit_pulse 3s ease-in-out infinite;
        transform-origin: 460px 150px;
      }
    </style>
  </defs>

  <rect width="920" height="400" fill="#070b16" rx="18" />
  <rect width="920" height="400" fill="url(#stack_glow)" rx="18" />
  <rect x="0.6" y="0.6" width="918.8" height="398.8" rx="17.4" fill="none" stroke="url(#stack_border)" stroke-width="1.2" />

  <!-- HEADER -->
  <g transform="translate(48, 42)">
    <text x="0" y="0" fill="#247bff" font-size="11" font-weight="800" letter-spacing="2">02 / TECHNICAL ORBITS &amp; STACK ECOSYSTEM</text>
    <text x="0" y="26" fill="#ffffff" font-size="22" font-weight="900">Distributed Architecture &amp; Tooling</text>
  </g>

  <!-- THREE TILTED ELLIPTICAL ORBITS -->
  <g transform="translate(0, 0)">
    <!-- Outer Orbit: Backend, Telemetry & Cloud -->
    <ellipse cx="460" cy="165" rx="360" ry="85" fill="none" stroke="rgba(36,123,255,0.25)" stroke-width="1.5" stroke-dasharray="5 5" />
    
    <!-- Middle Orbit: Frontend & Reactive UI -->
    <ellipse cx="460" cy="165" rx="270" ry="62" fill="none" stroke="rgba(0,245,255,0.3)" stroke-width="1.5" />
    
    <!-- Inner Orbit: Languages & Core DSA -->
    <ellipse cx="460" cy="165" rx="170" ry="38" fill="none" stroke="rgba(255,53,79,0.35)" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Center Sun / Core Hub -->
    <g class="orbit-center">
      <circle cx="460" cy="165" r="32" fill="#0d1933" stroke="#247bff" stroke-width="2" />
      <circle cx="460" cy="165" r="24" fill="#182c57" />
      <text x="460" y="162" fill="#00f5ff" font-size="10" font-weight="900" text-anchor="middle">CORE</text>
      <text x="460" y="174" fill="#ffffff" font-size="8" font-weight="800" text-anchor="middle">LOGIC</text>
    </g>

    <!-- Nodes on Inner Orbit (Languages) -->
    <!-- C++ -->
    <g transform="translate(290, 150)">
      <rect width="52" height="26" rx="6" fill="#070b16" stroke="#00599c" stroke-width="1.5" />
      <text x="26" y="17" fill="#60a5fa" font-size="11" font-weight="800" text-anchor="middle">C++</text>
    </g>
    <!-- JavaScript -->
    <g transform="translate(580, 150)">
      <rect width="40" height="26" rx="6" fill="#070b16" stroke="#f7df1e" stroke-width="1.5" />
      <text x="20" y="17" fill="#facc15" font-size="11" font-weight="800" text-anchor="middle">JS</text>
    </g>
    <!-- Python -->
    <g transform="translate(435, 115)">
      <rect width="56" height="24" rx="6" fill="#070b16" stroke="#3776ab" stroke-width="1.5" />
      <text x="28" y="16" fill="#93c5fd" font-size="11" font-weight="800" text-anchor="middle">Python</text>
    </g>

    <!-- Nodes on Middle Orbit (Frontend & Web) -->
    <!-- React.js -->
    <g transform="translate(195, 140)">
      <rect width="70" height="28" rx="6" fill="#070b16" stroke="#61dafb" stroke-width="1.5" />
      <text x="35" y="18" fill="#67e8f9" font-size="11" font-weight="800" text-anchor="middle">React.js</text>
    </g>
    <!-- Next.js -->
    <g transform="translate(650, 140)">
      <rect width="65" height="28" rx="6" fill="#070b16" stroke="#ffffff" stroke-width="1.5" />
      <text x="32" y="18" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">Next.js</text>
    </g>
    <!-- Angular -->
    <g transform="translate(340, 85)">
      <rect width="68" height="26" rx="6" fill="#070b16" stroke="#dd0031" stroke-width="1.5" />
      <text x="34" y="17" fill="#f87171" font-size="11" font-weight="800" text-anchor="middle">Angular</text>
    </g>
    <!-- TypeScript -->
    <g transform="translate(515, 85)">
      <rect width="80" height="26" rx="6" fill="#070b16" stroke="#3178c6" stroke-width="1.5" />
      <text x="40" y="17" fill="#60a5fa" font-size="11" font-weight="800" text-anchor="middle">TypeScript</text>
    </g>

    <!-- Nodes on Outer Orbit (Backend & Telemetry) -->
    <!-- Node.js -->
    <g transform="translate(105, 150)">
      <rect width="66" height="28" rx="6" fill="#070b16" stroke="#339933" stroke-width="1.5" />
      <text x="33" y="18" fill="#4ade80" font-size="11" font-weight="800" text-anchor="middle">Node.js</text>
    </g>
    <!-- Socket.io -->
    <g transform="translate(745, 150)">
      <rect width="72" height="28" rx="6" fill="#070b16" stroke="#00f5ff" stroke-width="1.5" />
      <text x="36" y="18" fill="#00f5ff" font-size="11" font-weight="800" text-anchor="middle">Socket.io</text>
    </g>
    <!-- MongoDB -->
    <g transform="translate(240, 215)">
      <rect width="75" height="26" rx="6" fill="#070b16" stroke="#47a248" stroke-width="1.5" />
      <text x="37" y="17" fill="#4ade80" font-size="11" font-weight="800" text-anchor="middle">MongoDB</text>
    </g>
    <!-- Supabase -->
    <g transform="translate(605, 215)">
      <rect width="78" height="26" rx="6" fill="#070b16" stroke="#3ecf8e" stroke-width="1.5" />
      <text x="39" y="17" fill="#34d399" font-size="11" font-weight="800" text-anchor="middle">Supabase</text>
    </g>
  </g>

  <!-- GROUPED CHIPS ROW AT BOTTOM -->
  <g transform="translate(48, 295)">
    <text x="0" y="0" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">GROUPED STACK CLUSTERS:</text>
    
    <g transform="translate(0, 15)">
      <!-- Cluster 1: Languages -->
      <rect width="185" height="42" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="12" y="18" fill="#60a5fa" font-size="10" font-weight="800">LANGUAGES (DSA)</text>
      <text x="12" y="32" fill="#cbd5e1" font-size="11" font-weight="600">C++ • JavaScript • Python • Java</text>

      <!-- Cluster 2: Frontend -->
      <g transform="translate(200, 0)">
        <rect width="215" height="42" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="12" y="18" fill="#00f5ff" font-size="10" font-weight="800">FRONTEND ARCHITECTURES</text>
        <text x="12" y="32" fill="#cbd5e1" font-size="11" font-weight="600">React.js • Next.js • Angular • TS</text>
      </g>

      <!-- Cluster 3: Backend & Telemetry -->
      <g transform="translate(430, 0)">
        <rect width="210" height="42" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="12" y="18" fill="#39d353" font-size="10" font-weight="800">BACKEND &amp; REAL-TIME</text>
        <text x="12" y="32" fill="#cbd5e1" font-size="11" font-weight="600">Node.js • Express • Socket.io</text>
      </g>

      <!-- Cluster 4: Databases & Cloud -->
      <g transform="translate(655, 0)">
        <rect width="170" height="42" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="12" y="18" fill="#ff354f" font-size="10" font-weight="800">DATABASES &amp; CLOUD</text>
        <text x="12" y="32" fill="#cbd5e1" font-size="11" font-weight="600">MongoDB • Supabase • OCI</text>
      </g>
    </g>
  </g>
</svg>