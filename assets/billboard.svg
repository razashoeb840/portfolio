<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto" style="background:#05070d; border-radius:12px; overflow:hidden; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlowRed" cx="85%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#b81d24" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#05070d" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bgGlowCyan" cx="15%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#005f73" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#05070d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f3f4f6" />
      <stop offset="100%" stop-color="#9ca3af" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e50914" />
      <stop offset="100%" stop-color="#ff2d55" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(229,9,20,0.5)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.1)" />
      <stop offset="100%" stop-color="rgba(0,245,255,0.3)" />
    </linearGradient>
    
    <!-- Filter for Cinema Glow -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmic Cinema Canvas -->
  <rect width="1200" height="420" fill="#05070d" />
  <rect width="1200" height="420" fill="url(#bgGlowRed)" />
  <rect width="1200" height="420" fill="url(#bgGlowCyan)" />

  <!-- Vignette & Light Streaks -->
  <path d="M-100,0 L600,420 L750,420 L50,-100 Z" fill="white" opacity="0.015" />
  <path d="M300,-100 L1100,420 L1250,420 L450,-100 Z" fill="#e50914" opacity="0.03" />

  <!-- Outer Border Stroke -->
  <rect x="1" y="1" width="1198" height="418" rx="11" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Stars/Dots -->
  <circle cx="150" cy="70" r="1.5" fill="#fff" opacity="0.3" />
  <circle cx="280" cy="110" r="1" fill="#00f5ff" opacity="0.5" />
  <circle cx="950" cy="80" r="2" fill="#fff" opacity="0.4" />
  <circle cx="1080" cy="160" r="1.5" fill="#e50914" opacity="0.6" />
  <circle cx="850" cy="340" r="1.5" fill="#00f5ff" opacity="0.4" />
  <circle cx="450" cy="370" r="1" fill="#fff" opacity="0.3" />

  <!-- Top Cinema Header: A SHOEB ORIGINAL -->
  <g transform="translate(60, 52)">
    <!-- Red Accent Bar -->
    <rect x="0" y="2" width="4" height="14" rx="2" fill="#e50914" />
    <text x="14" y="14" fill="#e50914" font-size="12" font-weight="900" letter-spacing="4" font-family="'Segoe UI', Roboto, sans-serif">A SHOEB ORIGINAL</text>
    <rect x="188" y="8" width="60" height="1" fill="rgba(229,9,20,0.4)" />
    
    <rect x="940" y="0" width="140" height="24" rx="12" fill="rgba(229,9,20,0.12)" stroke="rgba(229,9,20,0.4)" stroke-width="1" />
    <circle cx="955" cy="12" r="4" fill="#e50914" />
    <text x="968" y="16" fill="#fca5a5" font-size="11" font-weight="700" letter-spacing="1.5">NOW STREAMING</text>
  </g>

  <!-- Main Hero Title: SHOEB RAZA -->
  <g transform="translate(60, 150)">
    <text x="0" y="0" fill="url(#textShimmer)" font-size="82" font-weight="950" letter-spacing="1" font-family="Impact, 'Arial Black', -apple-system, sans-serif">
      SHOEB RAZA
    </text>
    <!-- Cyan Neon Underline Glow -->
    <rect x="0" y="16" width="360" height="4" rx="2" fill="url(#redAccent)" filter="url(#glowEffect)" opacity="0.8" />
  </g>

  <!-- Series Badge & Subtitle -->
  <g transform="translate(60, 198)">
    <text x="0" y="0" fill="#e50914" font-size="20" font-weight="900" letter-spacing="10" font-family="'Segoe UI', Roboto, sans-serif">
      THE SERIES
    </text>
  </g>

  <!-- OTT Badges Row -->
  <g transform="translate(60, 238)">
    <!-- 99% MATCH Badge -->
    <rect x="0" y="0" width="105" height="26" rx="4" fill="rgba(34,197,94,0.15)" stroke="#22c55e" stroke-width="1.2" />
    <text x="12" y="17" fill="#4ade80" font-size="12" font-weight="800" letter-spacing="0.5">★ 99% MATCH</text>

    <!-- 2024-PRESENT -->
    <rect x="115" y="0" width="125" height="26" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="126" y="17" fill="#e2e8f0" font-size="11" font-weight="700" letter-spacing="0.8">2024 – PRESENT</text>

    <!-- 4K ULTRA HD -->
    <rect x="250" y="0" width="115" height="26" rx="4" fill="rgba(0,245,255,0.08)" stroke="rgba(0,245,255,0.4)" stroke-width="1" />
    <text x="261" y="17" fill="#00f5ff" font-size="11" font-weight="800" letter-spacing="1">4K ULTRA HD</text>

    <!-- DOLBY ATMOS -->
    <rect x="375" y="0" width="115" height="26" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="386" y="17" fill="#e2e8f0" font-size="11" font-weight="700" letter-spacing="0.8">DOLBY ATMOS</text>

    <!-- 5 SEASONS -->
    <rect x="500" y="0" width="100" height="26" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="511" y="17" fill="#cbd5e1" font-size="11" font-weight="700" letter-spacing="0.8">5 SEASONS</text>

    <!-- TV-MA: MASTERY -->
    <rect x="610" y="0" width="140" height="26" rx="4" fill="rgba(229,9,20,0.12)" stroke="rgba(229,9,20,0.5)" stroke-width="1" />
    <text x="620" y="17" fill="#f87171" font-size="11" font-weight="800" letter-spacing="0.8">TV-MA • MASTERY</text>
  </g>

  <!-- Tagline / Synopsis -->
  <g transform="translate(60, 290)">
    <text x="0" y="0" fill="#94a3b8" font-size="14" font-weight="600" letter-spacing="2">
      FULL-STACK DEVELOPER • DSA SPECIALIST (350+ LEETCODE) • MERN &amp; NEXT.JS
    </text>
    <text x="0" y="24" fill="#cbd5e1" font-size="13" font-weight="400" letter-spacing="0.2">
      B.Tech CSE @ Lovely Professional University (CGPA 8.94) • OCI GenAI Certified • Systems Architect
    </text>
  </g>

  <!-- Interactive Billboard Status / Metric Badges (Right Bottom) -->
  <g transform="translate(60, 350)">
    <!-- Pill 1: CGPA -->
    <g transform="translate(0, 0)">
      <rect width="210" height="42" rx="8" fill="rgba(15,23,42,0.7)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="16" y="20" fill="#00f5ff" font-size="15" font-weight="800">8.94 CGPA</text>
      <text x="16" y="34" fill="#64748b" font-size="10" font-weight="600" letter-spacing="0.5">B.TECH CSE @ LPU</text>
    </g>

    <!-- Pill 2: LeetCode -->
    <g transform="translate(225, 0)">
      <rect width="210" height="42" rx="8" fill="rgba(15,23,42,0.7)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="16" y="20" fill="#facc15" font-size="15" font-weight="800">350+ PROBLEMS</text>
      <text x="16" y="34" fill="#64748b" font-size="10" font-weight="600" letter-spacing="0.5">LEETCODE (1432 RATING)</text>
    </g>

    <!-- Pill 3: CodeChef -->
    <g transform="translate(450, 0)">
      <rect width="210" height="42" rx="8" fill="rgba(15,23,42,0.7)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="16" y="20" fill="#fb923c" font-size="15" font-weight="800">2★ CODECHEF</text>
      <text x="16" y="34" fill="#64748b" font-size="10" font-weight="600" letter-spacing="0.5">CONTEST RATING 1428</text>
    </g>

    <!-- Pill 4: Flipkart GRID 8.0 -->
    <g transform="translate(675, 0)">
      <rect width="210" height="42" rx="8" fill="rgba(15,23,42,0.7)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="16" y="20" fill="#f43f5e" font-size="15" font-weight="800">FLIPKART GRID 8.0</text>
      <text x="16" y="34" fill="#64748b" font-size="10" font-weight="600" letter-spacing="0.5">NATIONAL SEMIFINALIST</text>
    </g>

    <!-- Pill 5: Production -->
    <g transform="translate(900, 0)">
      <rect width="180" height="42" rx="8" fill="rgba(15,23,42,0.7)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="16" y="20" fill="#34d399" font-size="15" font-weight="800">5+ ORIGINALS</text>
      <text x="16" y="34" fill="#64748b" font-size="10" font-weight="600" letter-spacing="0.5">LIVE PRODUCTION DEPLOYS</text>
    </g>
  </g>

  <!-- Right Side Visual N-ribbon Glow Silhouette -->
  <g transform="translate(970, 70)" opacity="0.12">
    <path d="M0,0 L60,0 L180,260 L180,0 L240,0 L240,300 L180,300 L60,40 L60,300 L0,300 Z" fill="#e50914" filter="url(#glowEffect)" />
  </g>
</svg>
